name: SAST SCAN
on: push

jobs:
  build:
    runs-on: ubuntu-latest
    name: Run unit tests and SAST scan on the source code 
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'adopt'
        cache: maven
    - name: SonarCloud Scan
      run: mvn -B verify sonar:sonar -Dsonar.projectKey=javaprojectsonar -Dsonar.organization=JavaProjectSonar -Dsonar.host.url=https://sonarcloud.io -Dsonar.login=$SONAR_TOKEN
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        sonar.organization: antero71-sonarcloud
        sonar.projectKey: antero71_snyk-java-reachability-playground
